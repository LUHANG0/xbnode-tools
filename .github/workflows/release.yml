name: Build and publish xbnode
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xbnode-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check manager and bootstrap
        run: |
          bash -n install.sh
          python -m unittest discover -s tests -v
      - name: Build pinned and patched binaries
        run: python tools/build.py
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Seven protocols through synthetic clients in isolated network
        run: bash tools/test-protocols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xbnode-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xbnode-release
          path: dist
      - name: Publish exact tag once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import json,os; assert json.load(open("dist/manifest.json"))["release"] == os.environ["RELEASE_TAG"]'
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
